<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PR-Sentinel pull request review comment preview</title>
  <desc id="desc">A screenshot-style preview of a GitHub pull request comment generated by PR-Sentinel.</desc>
  <rect width="1200" height="820" fill="#f6f8fa"/>
  <rect x="64" y="56" width="1072" height="708" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="64" y="56" width="1072" height="86" rx="12" fill="#f6f8fa"/>
  <path d="M64 130H1136" stroke="#d0d7de"/>
  <circle cx="112" cy="99" r="28" fill="#24292f"/>
  <path d="M99 102C99 93 105 87 113 87C121 87 127 93 127 102C127 110 121 116 113 116C105 116 99 110 99 102Z" fill="#ffffff"/>
  <text x="158" y="93" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">github-actions[bot]</text>
  <text x="158" y="121" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="17">commented on this pull request</text>
  <rect x="885" y="79" width="198" height="38" rx="19" fill="#dafbe1" stroke="#2da44e"/>
  <text x="914" y="104" fill="#116329" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PR-Sentinel Review</text>
  <text x="104" y="194" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">PR-Sentinel Review</text>
  <rect x="104" y="226" width="190" height="42" rx="21" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="128" y="253" fill="#7d4e00" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Needs changes</text>
  <text x="104" y="306" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="18">Reviewed 10 diff lines from 1 changed file using mock-reviewer-v1.</text>
  <text x="104" y="366" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Summary Verdict</text>
  <text x="104" y="402" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="18">Offline review completed. The action flow was verified without calling an external LLM API.</text>
  <text x="104" y="464" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Potential Bugs</text>
  <text x="132" y="500" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="18">No potential bugs identified from the diff.</text>
  <text x="104" y="562" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Security Issues</text>
  <rect x="104" y="586" width="992" height="82" rx="8" fill="#fff8f7" stroke="#ffebe9"/>
  <rect x="128" y="610" width="62" height="28" rx="14" fill="#ffebe9"/>
  <text x="147" y="630" fill="#cf222e" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">High</text>
  <text x="208" y="630" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Possible hardcoded secret</text>
  <text x="208" y="656" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="16">Move secrets into GitHub Secrets or a secure secret manager and read them from the environment.</text>
  <text x="104" y="720" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Code Style / Readability</text>
  <text x="132" y="754" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="18">Follow-up markers should be linked to a tracked issue or resolved before merge.</text>
</svg>
