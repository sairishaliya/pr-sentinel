name: PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  pr-sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PR-Sentinel
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_provider: mock
          model: mock-reviewer-v1
          max_diff_lines: "5000"
